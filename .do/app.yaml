name: website-istekrar
region: fra
services:
  - name: web
    git:
      branch: main
      repo_clone_url: ${REPO_URL}
    build_command: npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xs
    envs:
      - key: NODE_ENV
        value: production
    routes:
      - path: /
    health_check:
      http_path: /
